<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrasTV Radio</title>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;margin:0;padding:20px}
h1{color:#ff0000}
.player{width:100%;max-width:800px;height:450px;background:#111;margin:20px auto;border:2px solid #f00}
button{background:#f00;color:#fff;border:none;padding:15px 30px;margin:10px;font-size:18px;border-radius:10px}
</style>
</head>
<body>
<h1>📺 BrasTV Radio 🔴 AO VIVO</h1>
<div class="player" id="player">
<p style="padding-top:200px">Selecione um canal abaixo</p>
</div>
<button onclick="play('https://tv2.com.br/sua-lista.m3u8')">Globo</button>
<button onclick="play('SEU_LINK_AQUI')">SBT</button>
<button onclick="play('SEU_LINK_AQUI')">Record</button>
<script>
function play(url){
document.getElementById('player').innerHTML='<video controls autoplay style="width:100%;height:100%"><source src="'+url+'" type="application/x-mpegURL"></video>';
}
</script>
</body>
</html>
